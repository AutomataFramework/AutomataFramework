# `plan` says whether this run has code to test, and whether `browser` and `budgets` have their entry files. `lint`, `typecheck`, `test` and `build` run side by side, and
# `commit-authors` checks the names and words of a pull request, and `private-names` keeps private names out. `gate` is the one check `main` requires: it passes
# only when every job that applies ran and passed. Every action is pinned to a commit.
#
# The whole suite runs on every run, drafts included, because it takes seconds (Fast CI in the `this-repo` skill).
name: ci

on:
  pull_request:
    # `ready_for_review` runs it again as a draft is handed over.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # GitHub's merge queue tests each pull request merged with the current `main` before it lands.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push stops the pull request run it replaces. Runs on `main` are never cancelled, so every merge gets its own
# result.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `docs` is true when a pull request changes only Markdown that people read (CLAUDE.md and the notes under docs/).
  # A diff GitHub cannot give runs everything, never less.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      browser: ${{ steps.entry.outputs.browser }}
      budgets: ${{ steps.entry.outputs.budgets }}
    steps:
      # `browser` and `budgets` turn on only once their entry file exists, so this workflow can land before the
      # first change that uses them. Without the files the job is left out and `gate` passes without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            playwright.config.ts
            scripts/check-line-budgets.ts
          sparse-checkout-cone-mode: false
      - id: entry
        run: |
          set -euo pipefail
          browser=false
          budgets=false
          if [ -f playwright.config.ts ]; then browser=true; fi
          if [ -f scripts/check-line-budgets.ts ]; then budgets=true; fi
          echo "browser=$browser"
          echo "budgets=$budgets"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "budgets=$budgets" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs=false
          if [ "$EVENT" = pull_request ] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" && [ -n "$changed" ]; then
            printf 'This pull request changes:\n%s\n' "$changed"
            if ! grep -qvE '^(CLAUDE\.md|docs/.+\.md)$' <<<"$changed"; then docs=true; fi
          fi
          echo "docs=$docs"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  lint:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip

  typecheck:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The browser tests, in Playwright's own image for the locked version, pinned by digest, so the job installs no
  # browser or system library. `--user 1001` is the runner's own user, so the checkout stays writable, and
  # `--ipc=host` keeps Chromium from running out of shared memory. One piece: Framework's browser tests are few.
  browser:
    needs: plan
    if: needs.plan.outputs.docs != 'true' && needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser

  # The line budgets (`scripts/check-line-budgets.ts`).
  budgets:
    needs: plan
    if: needs.plan.outputs.docs != 'true' && needs.plan.outputs.budgets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun scripts/check-line-budgets.ts

  # The commits and the words of the pull request (`scripts/check-commit-authors.ts`), checked inside `gate` so the
  # merge queue, which waits only on `gate`, checks them too. A push to `main` has no pull request, so it is left out
  # there. It may write the pull request, only to take off the footer the cloud tool appends.
  commit-authors:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: node scripts/check-commit-authors.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}

  # No private name in any file, commit message or the pull request's words (`scripts/check-private-names.ts`). The
  # names come from the `PRIVATE_NAMES` secret and are never printed. It runs on every run, docs-only ones too. A pull
  # request from a fork gets no secret, so this fails there until a maintainer brings the change into a branch here.
  private-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: node scripts/check-private-names.ts
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # The one check `main` requires. It passes only when every job that applies ran and passed and every other was left
  # out by `plan`, so a job skipped because something before it failed never counts as passed. A new job is added to
  # `needs` and to APPLIES; the gate fails on a job it does not know.
  gate:
    needs: [plan, lint, typecheck, test, build, browser, budgets, commit-authors, private-names]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that applies ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          APPLIES: >-
            {"plan": true, "private-names": true, "commit-authors": ${{ github.event_name != 'push' }}, "lint": ${{ needs.plan.outputs.docs != 'true' }}, "typecheck": ${{ needs.plan.outputs.docs != 'true' }}, "test": ${{ needs.plan.outputs.docs != 'true' }}, "build": ${{ needs.plan.outputs.docs != 'true' }}, "browser": ${{ needs.plan.outputs.docs != 'true' && needs.plan.outputs.browser == 'true' }}, "budgets": ${{ needs.plan.outputs.docs != 'true' && needs.plan.outputs.budgets == 'true' }}}
          GATE: |
            const results = JSON.parse(process.env.RESULTS)
            const applies = JSON.parse(process.env.APPLIES)
            let ok = true
            for (const [job, want] of Object.entries(applies)) {
              const got = results[job]?.result
              const good = want ? got === 'success' : got === 'skipped'
              console.log(`${good ? 'ok ' : 'NO '} ${job}: ${want ? 'applies' : 'not applicable'}, ${got}`)
              ok &&= good
            }
            for (const job of Object.keys(results)) {
              if (!(job in applies)) {
                console.log(`NO  ${job}: the gate does not know this job`)
                ok = false
              }
            }
            process.exit(ok ? 0 : 1)
        run: node --input-type=module -e "$GATE"
        shell: bash
